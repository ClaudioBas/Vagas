<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestor de Vagas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f5;--surf:#fff;--ink:#14213d;--mut:#5d6b82;--line:#d8dee8;--acc:#1b4fd8;--accink:#fff;--ok:#117a4d;--warn:#b45309;--bad:#b42318;--warnbg:#fff4e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--surf:#172036;--ink:#e8edf7;--mut:#9aa8c2;--line:#2a3652;--acc:#6f9bff;--accink:#0e1524;--ok:#4ade9a;--warn:#fbbf24;--bad:#ff8a80;--warnbg:#2c2410}}
:root[data-theme="dark"]{--bg:#0e1524;--surf:#172036;--ink:#e8edf7;--mut:#9aa8c2;--line:#2a3652;--acc:#6f9bff;--accink:#0e1524;--ok:#4ade9a;--warn:#fbbf24;--bad:#ff8a80;--warnbg:#2c2410}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:1.1rem;font-weight:600;margin:0}
.sub{color:var(--mut);margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:8px 12px;min-height:40px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.g{border:0;background:none;color:var(--acc);padding:6px 8px;min-height:32px}
button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sum div{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px}
.sum b{display:block;font-size:1.4rem;font-weight:800}
.sum span{color:var(--mut);font-size:.85rem}
.alerts{background:var(--warnbg);border-left:5px solid var(--warn);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.alerts p{margin:4px 0}
.svc{background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.svh{padding:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.meta{color:var(--mut);font-size:.88rem}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.dots i.f{background:var(--acc)}
.mem{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem small{color:var(--mut);display:block;word-break:break-all}
.tag{display:inline-block;font-size:.78rem;border-radius:20px;padding:1px 9px;border:1px solid var(--line);margin-right:4px}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.warn{color:var(--warn);border-color:var(--warn)}
.act{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:18px 14px;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);width:min(440px,calc(100% - 24px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;margin:10px 0 0;font-size:.9rem;color:var(--mut)}
input,select{width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:42px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;color:var(--mut);font-size:.85rem;align-items:center}
[hidden]{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile,.card{display:block;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%}
.tile{display:flex;flex-direction:column;gap:6px;min-height:130px}
.bd{width:40px;height:40px;border-radius:10px;color:#fff;font-weight:800;display:grid;place-items:center;font-size:1.2rem}
.tile small,.card small{color:var(--mut)}
.card{margin-bottom:10px}
.mem{grid-template-columns:1fr}.mem .act{justify-content:flex-start}
#sb{margin-bottom:14px}#nav{margin-bottom:6px}
</style>
</head>
<body>
<main>
<div class="top">
  <div><h1>Gestor de Vagas</h1><p class="sub">Quem entrou, quando sai e quem já pagou.</p></div>
  <button class="p" id="addSvc">Nova assinatura</button>
</div>
<input id="sb" type="search" placeholder="Buscar pessoa ou e-mail"><div class="sum" id="sum"></div>
<div id="alerts"></div>
<div id="nav"></div><div id="list"></div>
<div class="foot">
  <button id="exp">Copiar backup</button>
  <button id="imp">Restaurar backup</button>
  <span>Os dados ficam só neste navegador. Faça backup de vez em quando.</span>
</div>
</main>

<dialog id="dS"><form method="dialog" id="fS">
  <h2 id="tS">Nova assinatura</h2>
  <label>Nome do serviço<input name="name" required list="svcs" placeholder="Escolha ou digite"></label><datalist id="svcs"><option value="YouTube Premium Família"><option value="Spotify Família"><option value="Netflix"><option value="Canva Pro"><option value="Disney+"><option value="Max"><option value="Prime Video"><option value="Apple Music Família"><option value="Duolingo Super Família"><option value="ChatGPT Plus"><option value="Microsoft 365 Família"><option value="Google One"><option value="Crunchyroll"></datalist>
  <label>Nome do grupo (opcional)<input name="group" placeholder="Ex.: Grupo 2 ou e-mail da conta"></label>
  <div class="row">
    <label>Vagas para membros<input name="slots" type="number" min="1" value="5" required></label>
    <label>Valor por membro (R$)<input name="price" type="number" min="0" step="0.01" required></label>
  </div>
  <label>Valor total do plano por mês (R$)<input name="cost" type="number" min="0" step="0.01" value="0"></label>
  <p class="meta" id="hint"></p><button type="button" id="useSug">Usar valor sugerido</button>
  <div class="btns"><button type="button" data-close>Cancelar</button><button class="p">Salvar</button></div>
</form></dialog>

<dialog id="dM"><form method="dialog" id="fM">
  <h2 id="tM">Novo membro</h2>
  <label>Nome<input name="name" required></label>
  <label>E-mail da conta<input name="email" type="email" required></label>
  <div class="row">
    <label>Data de entrada<input name="start" type="date" required></label>
    <label>Saída prevista<input name="end" type="date"></label>
  </div>
  <label>Contato (WhatsApp, opcional)<input name="phone" placeholder="(11) 90000-0000"></label>
  <div class="btns"><button type="button" data-close>Cancelar</button><button class="p">Salvar</button></div>
</form></dialog>

<dialog id="dB"><h2 id="tB"></h2><p class="meta" id="hB"></p><textarea id="taB" rows="8" style="width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.3 monospace"></textarea><input id="pwB" type="password" placeholder="Senha do backup" autocomplete="off" style="margin-top:8px"><div class="btns"><button type="button" data-close>Fechar</button><button type="button" class="p" id="okB"></button></div></dialog>

<script>
var KEY="gestor-vagas-v1",S={services:[],members:[]},editS=null,editM=null,curS=null;
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,10)}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fd(s){return s?pd(s).toLocaleDateString("pt-BR"):"—"}
function brl(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function daysTo(s){return Math.round((pd(s)-today())/864e5)}
function active(m){return !m.end||daysTo(m.end)>=0}
function fill(f,o){Array.prototype.forEach.call(f.elements,function(e){if(e.name)e.value=o&&o[e.name]!=null?o[e.name]:(e.defaultValue||"")})}
function openS(id){editS=id;var f=document.getElementById("fS");f.reset();fill(f,S.services.find(function(x){return x.id===id}));
  document.getElementById("tS").textContent=id?"Editar assinatura":"Nova assinatura";document.getElementById("dS").showModal()}
function openM(sid,id){curS=sid;editM=id;var f=document.getElementById("fM");f.reset();var m=S.members.find(function(x){return x.id===id});
  fill(f,m);if(!m)f.elements.start.value=new Date().toISOString().slice(0,10);
  document.getElementById("tM").textContent=id?"Editar membro":"Novo membro";document.getElementById("dM").showModal()}
document.getElementById("addSvc").onclick=function(){openS(null)};
document.getElementById("fS").onsubmit=function(){var e=this.elements,o={group:e.group.value.trim(),name:e.name.value.trim(),slots:+e.slots.value,price:+e.price.value,cost:+e.cost.value||0};
  if(editS){Object.assign(S.services.find(function(x){return x.id===editS}),o)}else{o.id=uid();S.services.push(o)}save();render()};
document.getElementById("fM").onsubmit=function(){var e=this.elements,o={name:e.name.value.trim(),email:e.email.value.trim(),start:e.start.value,end:e.end.value,phone:e.phone.value.trim()};
  if(editM){Object.assign(S.members.find(function(x){return x.id===editM}),o)}else{o.id=uid();o.sid=curS;o.paid=[];S.members.push(o)}save();render()};
document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=function(){b.closest("dialog").close()}});
var bMode="";
function openB(m){bMode=m;var t=document.getElementById("taB");document.getElementById("tB").textContent=m==="x"?"Backup dos dados":"Restaurar backup";document.getElementById("hB").textContent=m==="x"?"Toque em Copiar texto e guarde em um lugar seguro (notas, e-mail para você mesmo).":"Cole o texto do backup abaixo e toque em Restaurar.";t.value=m==="x"?JSON.stringify(S):"";document.getElementById("okB").textContent=m==="x"?"Copiar texto":"Restaurar";document.getElementById("dB").showModal();if(m==="x")t.select()}
document.getElementById("exp").onclick=function(){openB("x")};
document.getElementById("imp").onclick=function(){openB("i")};
document.getElementById("okB").onclick=function(){var t=document.getElementById("taB"),b=this;
  if(bMode==="x"){t.select();var ok=function(){b.textContent="Copiado!"};try{navigator.clipboard.writeText(t.value).then(ok,function(){document.execCommand("copy");ok()})}catch(e){try{document.execCommand("copy");ok()}catch(e2){}}}
  else{try{var d=JSON.parse(t.value);if(d.services&&d.members&&confirm("Substituir os dados atuais pelo backup?")){S=d;save();render();document.getElementById("dB").close()}}catch(e){alert("Texto de backup inválido.")}}};
function sug(){var f=document.getElementById("fS").elements,c=+f.cost.value||0,n=(+f.slots.value||0)+1,h=document.getElementById("hint");
  if(c>0&&n>1){var v=Math.ceil(c/n*100)/100,w=Math.ceil(c/(n-1)*100)/100;h.textContent="Dividindo entre você e "+(n-1)+" membros: "+brl(v)+" por pessoa. Se só os membros pagam: "+brl(w)+".";return v}
  h.textContent="Informe o valor do plano para ver a sugestão.";return 0}
document.getElementById("fS").oninput=sug;
document.getElementById("useSug").onclick=function(){var v=sug();if(v)document.getElementById("fS").elements.price.value=v.toFixed(2)};
document.getElementById("addSvc").addEventListener("click",sug);
document.getElementById("list").addEventListener("click",function(e){if(e.target.closest("[data-es]"))sug()});
function b64(u){var t="";u.forEach(function(x){t+=String.fromCharCode(x)});return btoa(t)}
function unb(t){return Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)})}
function dk(pw,salt){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])})}
function enc(txt,pw){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return dk(pw,salt).then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(txt))}).then(function(c){return "VAGAS1:"+b64(salt)+":"+b64(iv)+":"+b64(new Uint8Array(c))})}
function dec(str,pw){var p=str.trim().split(":");if(p[0]!=="VAGAS1")return Promise.reject();return dk(pw,unb(p[1])).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:unb(p[2])},k,unb(p[3]))}).then(function(b){return new TextDecoder().decode(b)})}
function openB(m){bMode=m;var x=m==="x";document.getElementById("tB").textContent=x?"Backup criptografado":"Restaurar backup";document.getElementById("hB").textContent=x?"Crie uma senha e toque em Gerar. Guarde o texto e a senha: sem a senha não dá para abrir.":"Cole o texto do backup, digite a senha e toque em Restaurar.";document.getElementById("taB").value="";document.getElementById("pwB").value="";document.getElementById("okB").textContent=x?"Gerar e copiar":"Restaurar";document.getElementById("dB").showModal()}
function restore(j){var d=JSON.parse(j);if(d.services&&d.members&&confirm("Substituir os dados atuais pelo backup?")){S=d;save();render();document.getElementById("dB").close()}}
document.getElementById("okB").onclick=function(){var t=document.getElementById("taB"),pw=document.getElementById("pwB").value,b=this;
  if(bMode!=="x"&&t.value.trim().charAt(0)==="{"){try{restore(t.value)}catch(e){alert("Texto inválido.")}return}
  if(pw.length<6){alert("Use uma senha de pelo menos 6 caracteres.");return}
  if(bMode==="x"){enc(JSON.stringify(S),pw).then(function(r){t.value=r;t.select();try{navigator.clipboard.writeText(r).then(function(){b.textContent="Copiado!"},function(){document.execCommand("copy")})}catch(e){try{document.execCommand("copy")}catch(e2){}}})}
  else{dec(t.value,pw).then(restore,function(){alert("Senha errada ou texto inválido.")})}};
var V={l:"home",cat:null,gid:null},Q="";
function cats(){var m={},o=[];S.services.forEach(function(x){if(!m[x.name]){m[x.name]=[];o.push(x.name)}m[x.name].push(x)});return{m:m,o:o}}
function gl(x){return x.group||"Grupo "+(S.services.filter(function(y){return y.name===x.name}).indexOf(x)+1)}
function cnt(x){return S.members.filter(function(m){return m.sid===x.id&&active(m)}).length}
function sv(id){return S.services.find(function(x){return x.id===id})}
function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h}
function go(l,cat,gid){V={l:l,cat:cat||null,gid:gid||null};Q="";document.getElementById("sb").value="";history.pushState(V,"");render();window.scrollTo(0,0)}
window.onpopstate=function(e){V=e.state||{l:"home",cat:null,gid:null};render()};
function st(list){var now=ym(today()),r={n:0,slots:0,free:0,unpaid:0,soon:0,rev:0,cost:0};
  list.forEach(function(x){var ms=S.members.filter(function(m){return m.sid===x.id&&active(m)});
    r.n+=ms.length;r.slots+=x.slots;r.free+=Math.max(0,x.slots-ms.length);r.rev+=ms.length*x.price;r.cost+=+x.cost||0;
    ms.forEach(function(m){if((m.paid||[]).indexOf(now)<0)r.unpaid++;if(m.end&&daysTo(m.end)<=15)r.soon++})});return r}
function dots(x){var n=cnt(x),d="";for(var i=0;i<x.slots;i++)d+='<i class="'+(i<n?"f":"")+'"></i>';return '<div class="dots" aria-hidden="true">'+d+"</div>"}
function tags(r){return (r.soon?'<span class="tag warn">'+r.soon+" saindo</span>":"")+(r.unpaid?'<span class="tag bad">'+r.unpaid+" pendente"+(r.unpaid>1?"s":"")+"</span>":"")}
function render(){
  var C=cats(),el=document.getElementById("list"),nav=document.getElementById("nav"),sm=document.getElementById("sum"),al=document.getElementById("alerts"),sb=document.getElementById("sb"),h="",s=V.gid&&sv(V.gid);
  if(V.l==="grp"&&!s)V.l=C.m[V.cat]?"svc":"home";
  if(V.l==="svc"&&!C.m[V.cat])V.l="home";
  var home=V.l==="home";sm.hidden=al.hidden=sb.hidden=!home;
  nav.innerHTML=home?"":'<button class="g" data-back="'+(V.l==="grp"?"svc":"home")+'">← '+esc(V.l==="grp"?V.cat:"Início")+"</button>";
  if(home){var all=st(S.services),a=[];
    sm.innerHTML="<div><b>"+brl(all.rev)+"</b><span>Receita prevista/mês</span></div><div><b>"+brl(all.rev-all.cost)+"</b><span>Lucro previsto/mês</span></div><div><b>"+all.free+"</b><span>Vagas livres</span></div><div><b>"+all.unpaid+"</b><span>Pagamentos pendentes</span></div>";
    S.members.filter(active).forEach(function(m){var x=sv(m.sid);if(x&&m.end&&daysTo(m.end)<=15){var d=daysTo(m.end);a.push('<p><button class="g" data-g="'+x.id+'"><b>'+esc(m.name)+"</b> sai de "+esc(x.name)+" · "+esc(gl(x))+(d===0?" hoje":" em "+d+" dia"+(d>1?"s":""))+"</button></p>")}});
    al.innerHTML=a.length?'<div class="alerts"><h2>Saídas próximas</h2>'+a.join("")+"</div>":"";
    if(Q){var r=S.members.filter(function(m){return (m.name+" "+m.email).toLowerCase().indexOf(Q)>=0});
      h=r.length?r.map(function(m){var x=sv(m.sid);return x?'<button class="card" data-g="'+x.id+'"><b>'+esc(m.name)+"</b><small><br>"+esc(m.email)+"<br>"+esc(x.name)+" · "+esc(gl(x))+(active(m)?"":" · saiu")+"</small></button>":""}).join(""):'<div class="empty">Ninguém encontrado.</div>'}
    else if(!C.o.length)h='<div class="svc"><div class="empty">Toque em “Nova assinatura” para começar (ex.: Canva Pro).</div></div>';
    else h='<div class="tiles">'+C.o.map(function(n){var l=C.m[n],q=st(l);return '<button class="tile" data-c="'+esc(n)+'"><span class="bd" style="background:hsl('+hue(n)+' 55% 40%)">'+esc(n.charAt(0).toUpperCase())+"</span><b>"+esc(n)+"</b><small>"+l.length+" grupo"+(l.length>1?"s":"")+" · "+q.free+" vaga"+(q.free===1?"":"s")+" livre"+(q.free===1?"":"s")+"</small><span>"+tags(q)+"</span></button>"}).join("")+"</div>"}
  else if(V.l==="svc"){var l2=C.m[V.cat],q2=st(l2);
    h='<div class="top"><div><h2 style="font-size:1.4rem">'+esc(V.cat)+'</h2><div class="meta">'+l2.length+" grupo"+(l2.length>1?"s":"")+" · "+q2.free+" vagas livres · lucro "+brl(q2.rev-q2.cost)+'/mês</div></div><button class="p" data-ng="1">Novo grupo</button></div><div style="height:12px"></div>'+
    l2.map(function(x){var q=st([x]);return '<button class="card" data-g="'+x.id+'"><b>'+esc(gl(x))+"</b><small> · "+q.n+"/"+x.slots+" vagas · "+brl(x.price)+"/membro</small>"+dots(x)+"<span>"+tags(q)+"</span></button>"}).join("")}
  else{var q3=st([s]),now=ym(today());
    h='<section class="svc"><div class="svh"><div><h2>'+esc(s.name)+" · "+esc(gl(s))+'</h2><div class="meta">'+brl(s.price)+" por membro · "+q3.n+"/"+s.slots+' vagas</div><div class="meta">Plano: '+brl(+s.cost||0)+" · Lucro: "+brl(q3.rev-q3.cost)+"</div>"+dots(s)+'</div><div class="act"><button class="p" data-am="'+s.id+'">Adicionar membro</button><button class="g" data-es="'+s.id+'">Editar</button><button class="g" data-dup="'+s.id+'">Novo grupo igual</button><button class="g d" data-ds="'+s.id+'">Excluir</button></div></div>';
    var ms=S.members.filter(function(m){return m.sid===s.id}).sort(function(a,b){return (active(b)-active(a))||(a.end||"9").localeCompare(b.end||"9")});
    if(!ms.length)h+='<div class="empty">Nenhum membro ainda.</div>';
    ms.forEach(function(m){var paid=(m.paid||[]).indexOf(now)>=0,on=active(m),t="";
      if(!on)t='<span class="tag">Saiu</span>';else{t='<span class="tag '+(paid?"ok":"bad")+'">'+(paid?"Pago":"Pendente")+"</span>";if(m.end){var d=daysTo(m.end);t+='<span class="tag warn">Sai em '+d+(d===1?" dia":" dias")+"</span>"}}
      h+='<div class="mem"><div><b>'+esc(m.name)+"</b> "+t+"<small>"+esc(m.email)+(m.phone?" · "+esc(m.phone):"")+"</small><small>Entrou "+fd(m.start)+" · Saída "+fd(m.end)+'</small></div><div class="act">'+(on?'<button data-pay="'+m.id+'">'+(paid?"Desfazer pago":"Marcar pago")+"</button>":"")+'<button class="g" data-em="'+m.id+'">Editar</button><button class="g d" data-dm="'+m.id+'">Remover</button></div></div>'});
    h+="</section>"}
  el.innerHTML=h}
document.getElementById("sb").oninput=function(){Q=this.value.trim().toLowerCase();render()};
document.querySelector("main").onclick=function(ev){var b=ev.target.closest("button");if(!b)return;var D=b.dataset,x;
  if(D.c)go("svc",D.c);
  else if(D.g){x=sv(D.g);go("grp",x.name,x.id)}
  else if(D.back){D.back==="home"?go("home"):go("svc",V.cat)}
  else if(D.ng){openS(null);document.getElementById("fS").elements.name.value=V.cat;sug()}
  else if(D.am)openM(D.am,null);
  else if(D.es){openS(D.es);sug()}
  else if(D.dup){x=sv(D.dup);var n={id:uid(),name:x.name,slots:x.slots,price:x.price,cost:x.cost,group:""};S.services.push(n);save();go("grp",n.name,n.id)}
  else if(D.em){var m=S.members.find(function(y){return y.id===D.em});openM(m.sid,m.id)}
  else if(D.pay){var m2=S.members.find(function(y){return y.id===D.pay}),k=ym(today());m2.paid=m2.paid||[];var i=m2.paid.indexOf(k);i<0?m2.paid.push(k):m2.paid.splice(i,1);save();render()}
  else if(D.dm){if(confirm("Remover este membro?")){S.members=S.members.filter(function(y){return y.id!==D.dm});save();render()}}
  else if(D.ds){if(confirm("Excluir este grupo e todos os membros dele?")){S.services=S.services.filter(function(y){return y.id!==D.ds});S.members=S.members.filter(function(y){return y.sid!==D.ds});save();V.l="svc";V.gid=null;render()}}};
history.replaceState(V,"");
load();render();
